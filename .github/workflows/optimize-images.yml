name: Optimize Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'static/images/**'
      - 'static/*.png'
      - 'static/*.jpg'
      - 'static/*.jpeg'
      - 'static/*.webp'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install optimizers
        run: sudo apt-get update && sudo apt-get install -y jpegoptim optipng

      - name: Optimize images
        run: |
          find static/images -iname '*.jpg' -o -iname '*.jpeg' | xargs -r jpegoptim --max=85 --strip-all
          find static/images -iname '*.png' | xargs -r optipng -o2

      - name: Commit optimized images
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: optimize images"
