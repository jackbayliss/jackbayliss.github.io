baseURL = "https://jackbayliss.com/"
languageCode = "en-gb"
title = "Jack Bayliss"
theme = "PaperMod"
enableRobotsTXT = true
timeZone = "Europe/London"

[taxonomies]
  tag = "tags"

[params]
  defaultTheme = "dark"
  ShowCodeCopyButtons = true
  disableScrollToTop = true
  ShowDate = false
  description = "Jack Bayliss is a PHP and Laravel developer from the Black Country, England, and a regular contributor to the Laravel framework."
  images = ["/images/emoji.png"]
  author = "Jack Bayliss"
  canonicalURL = true

[params.assets]
  theme_color = "#141312"
  msapplication_TileColor = "#141312"

[params.social]
  twitter = "jackbayliss1996"

[params.schema]
  sameAs = ["https://github.com/jackbayliss", "https://x.com/jackbayliss1996"]

[params.profileMode]
  enabled = false

# Tag archives are thin lists of posts, so keep them out of search results.
[[cascade]]
  robotsNoIndex = true
  [cascade.sitemap]
    disable = true
  [cascade._target]
    kind = "{taxonomy,term}"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "/portfolio/"
    weight = 4
  [[menu.main]]
    identifier = "cv"
    name = "CV"
    url = "/cv/"
    weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
