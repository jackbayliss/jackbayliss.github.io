<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
.post-description,.post-meta{display:none}

/* ── Design tokens ──────────────────────────────────── */
:root {
    --accent:       #10B981;
    --accent-hover: #059669;
    --accent-muted: rgba(16,185,129,0.12);
    --accent-border: rgba(16,185,129,0.30);
    --radius:       10px;
    --ease:         0.18s ease;
}

/* ── Global typography ──────────────────────────────── */
body,
.post-content,
.post-title,
h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}
code, pre, kbd, .highlight, .chroma {
    font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
}

/* ── Smooth links ───────────────────────────────────── */
a { transition: color var(--ease), border-color var(--ease); }
.post-content a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.post-content a:hover {
    color: var(--accent-hover);
    border-bottom-color: var(--accent-hover);
}

/* ── Nav active link ────────────────────────────────── */
#menu .active { color: var(--accent) !important; }

/* ── Post content polish ────────────────────────────── */
.post-title {
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
}
.post-content h1,
.post-content h2,
.post-content h3,
.post-content h4 {
    font-weight: 700;
    letter-spacing: -0.01em;
}
.post-content h2:not(.card-heading)::after,
.post-content h3:not(.card-heading)::after {
    content: "";
    display: block;
    width: 36px;
    height: 3px;
    margin-top: 0.6rem;
    border-radius: 2px;
    background: var(--accent);
}
.post-content p {
    line-height: 1.85;
}
.post-content li {
    line-height: 1.8;
    margin: 0.25rem 0;
}
.post-content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-muted);
    border-radius: 0 var(--radius) var(--radius) 0;
}
.post-content code {
    color: var(--accent);
    border: 1px solid var(--border);
}
.post-content pre code { color: inherit; border: none; }
/* dark mode's --code-block-bg happens to equal the card's --entry
   background, so code blocks need their own border to stay legible
   as a distinct block rather than blending into the card. The block
   itself is always dark-skinned regardless of site theme, so a
   light overlay border works consistently in both. */
.post-content .highlight:not(table) {
    border: 1px solid rgba(255,255,255,0.08);
}
.post-content table th {
    color: var(--accent);
}

/* ── Post list cards & nav active link ──────────────── */
.post-entry {
    transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
}
.post-entry:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 22px rgba(16,185,129,0.11);
    transform: translateY(-2px);
}
.post-entry:hover .entry-header h2 {
    color: var(--accent);
}
.entry-header h2 {
    transition: color var(--ease);
    letter-spacing: -0.01em;
}
#menu .active {
    border-bottom: 2px solid var(--accent) !important;
}

/* ── Tags ─────────────────────────────────────────────── */
.post-tags a {
    color: var(--accent);
    background: var(--accent-muted);
    border-color: var(--accent-border);
    font-weight: 500;
    transition: background var(--ease), border-color var(--ease);
}
.post-tags a:hover {
    background: var(--accent-border);
    border-color: var(--accent);
}

/* ── Soft animated mesh background ──────────────────── */
body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(circle at 18% 22%, rgba(16,185,129,0.08), transparent 40%),
        radial-gradient(circle at 85% 12%, rgba(52,211,153,0.06), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(5,150,105,0.05), transparent 45%);
    filter: blur(60px);
    animation: meshDrift 28s ease-in-out infinite alternate;
}
.dark body::before {
    background:
        radial-gradient(circle at 18% 22%, rgba(16,185,129,0.14), transparent 40%),
        radial-gradient(circle at 85% 12%, rgba(52,211,153,0.10), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(5,150,105,0.10), transparent 45%);
}
@keyframes meshDrift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(-3%, 2%) scale(1.05); }
    100% { transform: translate(3%, -2%) scale(1.02); }
}

/* ── Home page: cards ─────────────────────────────────── */
.card {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.1rem 2.2rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 20px rgba(0,0,0,0.05);
    animation: heroIn 0.5s ease-out both;
}
.dark .card {
    box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}

/* ── Post footer notes ────────────────────────────────── */
.post-footer { margin-top: 2rem; }
.post-note {
    padding-top: 1.25rem;
    margin: 0 0 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--secondary);
    line-height: 1.6;
}
.dark .post-note { border-top-color: rgba(255,255,255,0.08); }
.post-note a {
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.post-note a:hover { border-color: var(--accent); }
.post-note-muted {
    padding-top: 0;
    border-top: none;
    font-size: 0.8rem;
    opacity: 0.6;
}
.post-note-muted a { color: inherit; border-bottom-color: var(--border); }
.post-note-muted:hover { opacity: 0.85; }
@keyframes heroIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}
h2.card-heading {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1.1rem;
    padding: 0;
    border: none;
}

/* ── Home page: two-column layout ────────────────────── */
.main:has(.home-columns) {
    max-width: min(980px, calc(100vw - 2 * var(--gap)));
}
.home-columns {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1.75rem;
    align-items: start;
    margin: 2.5rem 0;
}
.home-col {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

/* ── Profile card ─────────────────────────────────────── */
.hero-emoji-img {
    width: 104px;
    height: auto;
    margin: 0 0 1.25rem;
    user-select: none;
    pointer-events: none;
    filter: drop-shadow(0 10px 20px rgba(16,185,129,0.18));
}
h1.profile-name {
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.4rem;
    padding: 0;
    border: none;
}
.profile-role {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--primary);
    margin: 0 0 0.35rem;
}
.profile-clock {
    font-size: 0.9rem;
    color: var(--secondary);
    margin: 0 0 1.4rem;
}
.hero-bio {
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--secondary);
    margin: 0;
}
.hero-bio a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.hero-bio a:hover { border-color: var(--accent); }

/* ── Profile card footer (buttons) ───────────────────── */
.profile-footer {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.5rem;
}
.profile-footer .hero-link {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--theme);
    padding: 0;
}
.profile-footer .hero-link-label { display: none; }
.profile-footer .hero-link svg { width: 20px; height: 20px; }
.dark .profile-footer .hero-link { border-color: rgba(255,255,255,0.08); }
.profile-footer .hero-link:hover { background: var(--accent-muted); border-color: var(--accent-border); transform: none; }
.profile-footer .hero-link.primary { background: var(--accent-muted); border-color: var(--accent-border); color: var(--accent) !important; }
.profile-footer .hero-link.primary:hover { background: var(--accent-muted) !important; border-color: var(--accent) !important; color: var(--accent) !important; }

/* ── Hero link buttons ──────────────────────────────── */
.post-content .hero-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1.2rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none !important;
    border: 1px solid var(--border);
    background: var(--theme);
    color: var(--primary) !important;
    transition: border-color var(--ease), transform var(--ease), color var(--ease);
}
.hero-link svg { width: 16px; height: 16px; flex-shrink: 0; }
.hero-link-label { white-space: nowrap; }
.hero-link:hover {
    border-color: var(--accent);
    color: var(--accent) !important;
    transform: translateY(-2px);
}
.hero-link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff !important;
}
.hero-link.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff !important;
}

/* ── Now card ─────────────────────────────────────────── */
.now-text {
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--secondary);
    margin: 0;
}

/* ── Timeline (home page) ───────────────────────────── */
.timeline-list {
    list-style: none;
    margin: 0;
    padding: 0;
}
.timeline-item {
    display: flex;
    gap: 1.1rem;
    padding: 0.55rem 0;
}
.timeline-item + .timeline-item { border-top: 1px solid var(--border); }
.dark .timeline-item + .timeline-item { border-top-color: rgba(255,255,255,0.08); }
.timeline-year {
    flex-shrink: 0;
    width: 5rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
}
.timeline-text {
    font-size: 0.96rem;
    line-height: 1.55;
    color: var(--secondary);
}

/* ── Portfolio card grid ────────────────────────────── */
.proj-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
}
.proj-card {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    text-decoration: none !important;
    color: inherit !important;
}
.proj-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 22px rgba(16,185,129,0.11);
    transform: translateY(-2px);
}
.proj-card:hover .proj-card-link { gap: 0.55rem; }
.proj-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
}
.proj-card-name {
    margin: 0;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--primary);
}
.proj-status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
    margin-top: 0.1rem;
}
.proj-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}
.proj-status.live {
    background: rgba(34,197,94,0.10);
    color: #16a34a;
    border: 1px solid rgba(34,197,94,0.22);
}
.dark .proj-status.live {
    color: #4ade80;
    background: rgba(74,222,128,0.10);
    border-color: rgba(74,222,128,0.22);
}
.proj-status.archived {
    background: rgba(245,158,11,0.10);
    color: #b45309;
    border: 1px solid rgba(245,158,11,0.22);
}
.dark .proj-status.archived {
    color: #fbbf24;
    background: rgba(251,191,36,0.10);
    border-color: rgba(251,191,36,0.22);
}
.proj-card-desc {
    margin: 0;
    font-size: 0.85rem;
    color: var(--secondary);
    line-height: 1.6;
    flex: 1;
}
.proj-card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--accent) !important;
    text-decoration: none !important;
    margin-top: 0.25rem;
    transition: gap var(--ease);
}
.proj-card-link:hover { gap: 0.55rem !important; }

/* ── Lightbox (about page car/cat photos) ────────────── */
.lightbox-img {
    transition: transform var(--ease), filter var(--ease);
}
.lightbox-img:hover {
    transform: scale(1.03);
    filter: brightness(1.05);
}
.lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 1000;
    cursor: zoom-out;
    opacity: 0;
    animation: lightboxIn 0.2s ease forwards;
}
@keyframes lightboxIn { to { opacity: 1; } }
.lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* ── Recent posts list (used inside .posts-card) ─────── */
.recent-posts-list {
    display: flex;
    flex-direction: column;
}
.post-content .recent-post-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 0;
    text-decoration: none !important;
    border-bottom: none;
    color: inherit !important;
}
.recent-post-card + .recent-post-card { border-top: 1px solid var(--border); }
.dark .recent-post-card + .recent-post-card { border-top-color: rgba(255,255,255,0.08); }
.recent-post-title {
    font-size: 0.96rem;
    font-weight: 600;
    color: var(--primary);
    transition: color var(--ease);
}
.recent-post-card:hover .recent-post-title {
    color: var(--accent);
}
.recent-post-meta {
    flex-shrink: 0;
    font-size: 0.82rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--secondary);
    white-space: nowrap;
}
.post-content .recent-posts-more {
    display: inline-block;
    margin-top: 1rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent) !important;
    text-decoration: none !important;
    border-bottom: none;
    transition: gap var(--ease);
}
.recent-posts-more:hover { opacity: 0.8; }

/* burger button — hidden on desktop */
#burger{display:none;background:none;border:none;padding:4px;cursor:pointer;color:inherit;margin:auto 4px}

@media(max-width:768px){
    #burger{display:flex;align-items:center;justify-content:center}

    /* stretch logo row so burger sits at the far right */
    .header .nav{flex-wrap:nowrap}
    .header .logo{flex:1;justify-content:space-between}

    /* sticky header so fixed menu anchors correctly */
    .header{position:sticky;top:0;z-index:100;background:var(--theme)}

    /* dropdown — fixed so it tracks the viewport when the page scrolls */
    #menu{
        display:none;
        position:fixed;
        top:var(--header-height);
        left:0;
        right:0;
        flex-direction:column;
        background:var(--theme);
        border-bottom:1px solid var(--border);
        padding:0 var(--gap) var(--gap);
        z-index:999;
        white-space:normal;
        overflow-x:unset
    }

    #menu.mobile-open{display:flex}

    #menu li+li{margin-inline-start:0;margin-top:12px}

    /* animate burger → X */
    #burger{overflow:visible}
    #burger svg{overflow:visible}
    #burger.is-open .burger-line-1{transform:translateY(6px) rotate(45deg);transform-origin:center}
    #burger.is-open .burger-line-2{opacity:0}
    #burger.is-open .burger-line-3{transform:translateY(-6px) rotate(-45deg);transform-origin:center}
    #burger svg line{transition:transform .2s ease,opacity .15s ease}

    /* remove the dead space above the cards on mobile */
    .main:has(.home-columns){padding-top:0.5rem}
    .home-columns{grid-template-columns:1fr;margin:1.5rem 0}
    .card{padding:1.35rem 1.4rem}

    /* one project per row, tighter padding */
    .proj-grid{grid-template-columns:1fr;gap:0.75rem}
    .proj-card{padding:1rem 1.1rem}
}

</style>
