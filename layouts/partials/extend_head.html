<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
.post-description,.post-meta{display:none}

/* ── Design tokens ──────────────────────────────────── */
:root {
    --accent:       #3B82F6;
    --accent-hover: #2563EB;
    --accent-muted: rgba(59,130,246,0.12);
    --accent-border: rgba(59,130,246,0.30);
    --radius:       10px;
    --ease:         0.18s ease;
}

/* ── Global typography ──────────────────────────────── */
body,
.post-content,
.post-title,
h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}
code, pre, kbd, .highlight, .chroma {
    font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
}

/* ── Smooth links ───────────────────────────────────── */
a { transition: color var(--ease), border-color var(--ease); }
.post-content a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.post-content a:hover {
    color: var(--accent-hover);
    border-bottom-color: var(--accent-hover);
}

/* ── Nav active link ────────────────────────────────── */
#menu .active { color: var(--accent) !important; }

/* ── Hero (home page) ───────────────────────────────── */
.hero {
    padding: 3rem 0 2.5rem;
    text-align: center;
}
.hero-emoji-img {
    width: 180px;
    height: auto;
    display: block;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 1.5rem;
    user-select: none;
    pointer-events: none;
}
.hero-title {
    font-size: clamp(2.2rem, 5.5vw, 3.5rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, var(--primary) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0 0 0.5rem;
}
.hero-role {
    font-size: 0.95rem;
    color: var(--secondary);
    margin: 0 0 1.5rem;
    letter-spacing: 0.01em;
}
.hero-bio {
    max-width: 520px;
    margin: 0 auto 2rem;
    font-size: 0.975rem;
    line-height: 1.8;
    color: var(--secondary);
}
.hero-bio a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.hero-bio a:hover { border-color: var(--accent); }
.hero-links {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    flex-wrap: wrap;
}
.hero-link {
    display: inline-flex;
    align-items: center;
    padding: 0.65rem 1.6rem;
    border-radius: 999px;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none !important;
    border: 1px solid transparent;
    transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), color var(--ease), transform var(--ease);
}
.hero-link.primary {
    background: var(--accent);
    color: #fff !important;
    border-color: var(--accent);
}
.hero-link.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    box-shadow: 0 0 0 4px rgba(59,130,246,0.18);
    transform: translateY(-1px);
}
.hero-link.secondary {
    background: transparent;
    color: var(--primary) !important;
    border-color: var(--border);
}
.hero-link.secondary:hover {
    border-color: var(--accent);
    color: var(--accent) !important;
    transform: translateY(-1px);
}

/* ── Portfolio card grid ────────────────────────────── */
.proj-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
}
.proj-card {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    text-decoration: none !important;
    color: inherit !important;
}
.proj-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 22px rgba(59,130,246,0.11);
    transform: translateY(-2px);
}
.proj-card:hover .proj-card-link { gap: 0.55rem; }
.proj-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
}
.proj-card-name {
    margin: 0;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--primary);
}
.proj-status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
    margin-top: 0.1rem;
}
.proj-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}
.proj-status.live {
    background: rgba(34,197,94,0.10);
    color: #16a34a;
    border: 1px solid rgba(34,197,94,0.22);
}
.dark .proj-status.live {
    color: #4ade80;
    background: rgba(74,222,128,0.10);
    border-color: rgba(74,222,128,0.22);
}
.proj-status.archived {
    background: rgba(245,158,11,0.10);
    color: #b45309;
    border: 1px solid rgba(245,158,11,0.22);
}
.dark .proj-status.archived {
    color: #fbbf24;
    background: rgba(251,191,36,0.10);
    border-color: rgba(251,191,36,0.22);
}
.proj-card-desc {
    margin: 0;
    font-size: 0.85rem;
    color: var(--secondary);
    line-height: 1.6;
    flex: 1;
}
.proj-card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--accent) !important;
    text-decoration: none !important;
    margin-top: 0.25rem;
    transition: gap var(--ease);
}
.proj-card-link:hover { gap: 0.55rem !important; }

/* burger button — hidden on desktop */
#burger{display:none;background:none;border:none;padding:4px;cursor:pointer;color:inherit;margin:auto 4px}

@media(max-width:768px){
    #burger{display:flex;align-items:center;justify-content:center}

    /* stretch logo row so burger sits at the far right */
    .header .nav{flex-wrap:nowrap}
    .header .logo{flex:1;justify-content:space-between}

    /* sticky header so fixed menu anchors correctly */
    .header{position:sticky;top:0;z-index:100;background:var(--theme)}

    /* dropdown — fixed so it tracks the viewport when the page scrolls */
    #menu{
        display:none;
        position:fixed;
        top:var(--header-height);
        left:0;
        right:0;
        flex-direction:column;
        background:var(--theme);
        border-bottom:1px solid var(--border);
        padding:0 var(--gap) var(--gap);
        z-index:999;
        white-space:normal;
        overflow-x:unset
    }

    #menu.mobile-open{display:flex}

    #menu li+li{margin-inline-start:0;margin-top:12px}

    /* animate burger → X */
    #burger{overflow:visible}
    #burger svg{overflow:visible}
    #burger.is-open .burger-line-1{transform:translateY(6px) rotate(45deg);transform-origin:center}
    #burger.is-open .burger-line-2{opacity:0}
    #burger.is-open .burger-line-3{transform:translateY(-6px) rotate(-45deg);transform-origin:center}
    #burger svg line{transition:transform .2s ease,opacity .15s ease}
}
</style>
