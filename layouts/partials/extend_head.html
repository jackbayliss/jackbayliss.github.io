<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
.post-description,.post-meta{display:none}

/* ── Design tokens ──────────────────────────────────── */
:root {
    --accent:       #8B5CF6;
    --accent-hover: #7C3AED;
    --accent-muted: rgba(139,92,246,0.12);
    --accent-border: rgba(139,92,246,0.30);
    --radius:       10px;
    --ease:         0.18s ease;
}

/* ── Global typography ──────────────────────────────── */
body,
.post-content,
.post-title,
h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}
code, pre, kbd, .highlight, .chroma {
    font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
}

/* ── Smooth links ───────────────────────────────────── */
a { transition: color var(--ease), border-color var(--ease); }
.post-content a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.post-content a:hover {
    color: var(--accent-hover);
    border-bottom-color: var(--accent-hover);
}

/* ── Nav active link ────────────────────────────────── */
#menu .active { color: var(--accent) !important; }

/* ── Soft animated mesh background ──────────────────── */
body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(circle at 18% 22%, rgba(139,92,246,0.07), transparent 40%),
        radial-gradient(circle at 85% 12%, rgba(236,72,153,0.06), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(34,197,94,0.05), transparent 45%);
    filter: blur(60px);
    animation: meshDrift 28s ease-in-out infinite alternate;
}
.dark body::before {
    background:
        radial-gradient(circle at 18% 22%, rgba(139,92,246,0.12), transparent 40%),
        radial-gradient(circle at 85% 12%, rgba(236,72,153,0.10), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(34,197,94,0.08), transparent 45%);
}
@keyframes meshDrift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(-3%, 2%) scale(1.05); }
    100% { transform: translate(3%, -2%) scale(1.02); }
}

/* ── Hero (home page) ───────────────────────────────── */
.hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5rem 0 3rem;
    text-align: center;
    animation: heroIn 0.6s ease-out both;
}
@keyframes heroIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.hero-emoji-img {
    width: 200px;
    height: auto;
    margin: 0 0 1.5rem;
    user-select: none;
    pointer-events: none;
}
.hero-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent);
    margin: 0 0 1.5rem;
    letter-spacing: 0.01em;
}
.hero-role::before { content: "> "; opacity: 0.6; }
.hero-bio {
    max-width: 540px;
    margin: 0 auto 2.25rem;
    font-size: 1.02rem;
    line-height: 1.85;
    color: var(--secondary);
}
.hero-bio a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid var(--accent-border);
}
.hero-bio a:hover { border-color: var(--accent); }

/* ── Hero link buttons ──────────────────────────────── */
.hero-links {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
}
.hero-link {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.8rem 1.85rem;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none !important;
    border: 1px solid var(--border);
    background: var(--entry);
    color: var(--primary) !important;
    transition: border-color var(--ease), transform var(--ease), color var(--ease);
}
.hero-link svg { width: 18px; height: 18px; flex-shrink: 0; }
.hero-link:hover {
    border-color: var(--accent);
    color: var(--accent) !important;
    transform: translateY(-2px);
}
.hero-link.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff !important;
}
.hero-link.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff !important;
}

/* ── Portfolio card grid ────────────────────────────── */
.proj-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
}
.proj-card {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    text-decoration: none !important;
    color: inherit !important;
}
.proj-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 22px rgba(139,92,246,0.11);
    transform: translateY(-2px);
}
.proj-card:hover .proj-card-link { gap: 0.55rem; }
.proj-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
}
.proj-card-name {
    margin: 0;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--primary);
}
.proj-status {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    white-space: nowrap;
    margin-top: 0.1rem;
}
.proj-status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}
.proj-status.live {
    background: rgba(34,197,94,0.10);
    color: #16a34a;
    border: 1px solid rgba(34,197,94,0.22);
}
.dark .proj-status.live {
    color: #4ade80;
    background: rgba(74,222,128,0.10);
    border-color: rgba(74,222,128,0.22);
}
.proj-status.archived {
    background: rgba(245,158,11,0.10);
    color: #b45309;
    border: 1px solid rgba(245,158,11,0.22);
}
.dark .proj-status.archived {
    color: #fbbf24;
    background: rgba(251,191,36,0.10);
    border-color: rgba(251,191,36,0.22);
}
.proj-card-desc {
    margin: 0;
    font-size: 0.85rem;
    color: var(--secondary);
    line-height: 1.6;
    flex: 1;
}
.proj-card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--accent) !important;
    text-decoration: none !important;
    margin-top: 0.25rem;
    transition: gap var(--ease);
}
.proj-card-link:hover { gap: 0.55rem !important; }

/* burger button — hidden on desktop */
#burger{display:none;background:none;border:none;padding:4px;cursor:pointer;color:inherit;margin:auto 4px}

@media(max-width:768px){
    #burger{display:flex;align-items:center;justify-content:center}

    /* stretch logo row so burger sits at the far right */
    .header .nav{flex-wrap:nowrap}
    .header .logo{flex:1;justify-content:space-between}

    /* sticky header so fixed menu anchors correctly */
    .header{position:sticky;top:0;z-index:100;background:var(--theme)}

    /* dropdown — fixed so it tracks the viewport when the page scrolls */
    #menu{
        display:none;
        position:fixed;
        top:var(--header-height);
        left:0;
        right:0;
        flex-direction:column;
        background:var(--theme);
        border-bottom:1px solid var(--border);
        padding:0 var(--gap) var(--gap);
        z-index:999;
        white-space:normal;
        overflow-x:unset
    }

    #menu.mobile-open{display:flex}

    #menu li+li{margin-inline-start:0;margin-top:12px}

    /* animate burger → X */
    #burger{overflow:visible}
    #burger svg{overflow:visible}
    #burger.is-open .burger-line-1{transform:translateY(6px) rotate(45deg);transform-origin:center}
    #burger.is-open .burger-line-2{opacity:0}
    #burger.is-open .burger-line-3{transform:translateY(-6px) rotate(-45deg);transform-origin:center}
    #burger svg line{transition:transform .2s ease,opacity .15s ease}
}
</style>
