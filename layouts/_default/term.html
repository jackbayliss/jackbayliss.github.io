{{- define "main" }}

<header class="page-intro">
  <a href="{{ "blog/" | absURL }}" class="label">&larr; All posts</a>
  <h1 class="page-intro-title">Posts tagged <span class="muted">{{ .Title }}</span></h1>
</header>

{{- range .Pages.GroupByDate "2006" }}
<section class="section archive-year">
  <h2 class="label">{{ .Key }}</h2>
  <ul class="post-list">
    {{- range .Pages }}
    {{- partial "post-row.html" . }}
    {{- end }}
  </ul>
</section>
{{- end }}

{{- end }}
