{{- define "main" }}

<header class="page-intro">
  <span class="label">{{ .Title }}</span>
  <h1 class="page-intro-title">
    Mostly Laravel, <span class="muted">occasionally conferences, always a bit of rambling.</span>
  </h1>
</header>

{{- range .RegularPages.GroupByDate "2006" }}
<section class="section archive-year">
  <h2 class="label">{{ .Key }}</h2>
  <ul class="post-list">
    {{- range .Pages }}
    {{- partial "post-row.html" . }}
    {{- end }}
  </ul>
</section>
{{- end }}

{{- end }}
